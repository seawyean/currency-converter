<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JPY ↔ THB Currency Converter</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --success: #047857;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input, select, button {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 18px;
    }

    input, select {
      padding: 0 14px;
      background: #fff;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      gap: 12px;
      align-items: end;
    }

    .swap {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      cursor: pointer;
      border: 1px solid #bfdbfe;
    }

    .swap:hover {
      filter: brightness(.98);
    }

    .result {
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: #f9fafb;
      border: 1px solid var(--border);
    }

    .result .small {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .result .big {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .rate-line {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .note {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      line-height: 1.5;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 18px;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .swap {
        width: 100%;
      }
      .result .big {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Currency Converter</h1>
      <p class="sub">คำนวณค่าเงินระหว่างเยนญี่ปุ่น (JPY) และบาทไทย (THB) แบบรวดเร็ว</p>

      <div class="field">
        <label for="amount">จำนวนเงิน</label>
        <input id="amount" type="number" min="0" step="0.01" value="1000" inputmode="decimal" />
      </div>

      <div class="grid">
        <div class="field">
          <label for="from">จาก</label>
          <select id="from">
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="THB">THB - Thai Baht</option>
          </select>
        </div>

        <button id="swap" class="swap" type="button" aria-label="สลับสกุลเงิน">⇄ สลับ</button>

        <div class="field">
          <label for="to">เป็น</label>
          <select id="to">
            <option value="THB">THB - Thai Baht</option>
            <option value="JPY">JPY - Japanese Yen</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="rate">อัตราแลกเปลี่ยน (แก้เองได้)</label>
        <input id="rate" type="number" min="0" step="0.0001" value="0.2200" inputmode="decimal" />
      </div>

      <div class="result" aria-live="polite">
        <div class="small">ผลลัพธ์โดยประมาณ</div>
        <div id="result" class="big">฿220.00</div>
        <div id="rateLine" class="rate-line">1 JPY = 0.2200 THB</div>
      </div>

      <div class="note">
        เวอร์ชันนี้ใช้เรทที่กรอกเอง เพื่อให้ใช้งานบน GitHub Pages ได้ง่ายและเสถียร
        หากต้องการดึงเรทปัจจุบันอัตโนมัติ สามารถเพิ่ม API ภายหลังได้
      </div>

      <div class="footer">JPY ↔ THB Converter</div>
    </section>
  </main>

  <script>
    const amountEl = document.getElementById("amount");
    const fromEl = document.getElementById("from");
    const toEl = document.getElementById("to");
    const rateEl = document.getElementById("rate");
    const swapEl = document.getElementById("swap");
    const resultEl = document.getElementById("result");
    const rateLineEl = document.getElementById("rateLine");

    function formatCurrency(value, currency) {
      return new Intl.NumberFormat("th-TH", {
        style: "currency",
        currency,
        maximumFractionDigits: currency === "JPY" ? 0 : 2
      }).format(value);
    }

    function normalizePair() {
      if (fromEl.value === toEl.value) {
        toEl.value = fromEl.value === "JPY" ? "THB" : "JPY";
      }
    }

    function calculate() {
      normalizePair();

      const amount = Math.max(0, Number(amountEl.value) || 0);
      const baseRate = Math.max(0, Number(rateEl.value) || 0);

      let result = 0;
      let shownRate = "";

      if (fromEl.value === "JPY" && toEl.value === "THB") {
        result = amount * baseRate;
        shownRate = `1 JPY = ${baseRate.toFixed(4)} THB`;
      } else {
        result = baseRate > 0 ? amount / baseRate : 0;
        const inverse = baseRate > 0 ? 1 / baseRate : 0;
        shownRate = `1 THB = ${inverse.toFixed(4)} JPY`;
      }

      resultEl.textContent = formatCurrency(result, toEl.value);
      rateLineEl.textContent = shownRate;
    }

    [amountEl, fromEl, toEl, rateEl].forEach(el => {
      el.addEventListener("input", calculate);
      el.addEventListener("change", calculate);
    });

    swapEl.addEventListener("click", () => {
      const oldFrom = fromEl.value;
      fromEl.value = toEl.value;
      toEl.value = oldFrom;
      calculate();
    });

    calculate();
  </script>
</body>
</html>
